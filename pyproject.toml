[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
include = [
    "src/data_paths.py",
    "tests/test_data_paths.py",
    "src/models/id_generator.py",
    "src/models/patient_plan_state.py",
    "src/calendar_presentation.py",
    "src/roster_assignment.py",
    "src/roster_month.py",
    "src/views/models/**/*.py",
    "tests/test_roster_month.py",
    "src/views/dialog_assegnazione_turno.py",
    "tests/test_calendar_presentation.py",
    "src/views/components/modal_dialog.py",
    "src/views/components/messages.py",
    "src/error_messages.py",
    "tests/test_italian_messages.py",
    "tests/test_roster_assignment.py",
    "src/importers/**/*.py",
    "src/exports/**/*.py",
    "src/planning_schema.py",
    "src/patient_fields.py",
    "src/optimization/**/*.py",
    "src/workers/**/*.py",
    "scripts/migrate_platform_json_v1.py",
    "scripts/reset_demo_data.py",
    "scripts/verify_synthetic_planning.py",
    "tests/test_demo_data.py",
    "tests/conftest.py",
    "tests/controllers/**/*.py",
    "tests/models/**/*.py",
    "tests/importers/**/*.py",
    "tests/exports/**/*.py",
    "tests/optimization/**/*.py",
    "tests/workers/**/*.py",
    "tests/views/**/*.py",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
