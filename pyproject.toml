[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
include = [
    "src/data_paths.py",
    "tests/test_data_paths.py",
    "src/models/id_generator.py",
    "src/models/patient_plan_state.py",
    "src/calendar_presentation.py",
    "src/calendar_versions.py",
    "src/importers/**/*.py",
    "src/exports/**/*.py",
    "src/planning_schema.py",
    "src/patient_fields.py",
    "src/optimization/**/*.py",
    "src/workers/**/*.py",
    "scripts/migrate_platform_json_v1.py",
    "scripts/reset_demo_data.py",
    "scripts/verify_synthetic_planning.py",
    "tests/test_demo_data.py",
    "tests/conftest.py",
    "tests/controllers/**/*.py",
    "tests/models/**/*.py",
    "tests/importers/**/*.py",
    "tests/integration/**/*.py",
    "tests/exports/**/*.py",
    "tests/optimization/**/*.py",
    "tests/workers/**/*.py",
    "tests/views/**/*.py",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
